<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f2f8f4;
    --mint:#d9f2e8;
    --green:#1a8a4f;
    --green-strong:#127040;
    --green-ink:#0f3d24;
    --ink:#182420;
    --muted:#5d6f66;
    --line:#e0ebe4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  }

  .wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:28px 20px;
  }
  .card{
    max-width:440px;width:100%;text-align:center;
  }

  .check{
    width:76px;height:76px;border-radius:50%;background:var(--mint);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  }
  .check svg{width:38px;height:38px}

  h1{font-size:1.5rem;line-height:1.2;font-weight:800;letter-spacing:-0.01em}
  .lead{margin-top:12px;font-size:1rem;color:var(--muted)}
  .lead b{color:var(--ink)}

  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;text-decoration:none;text-align:center;
    background:var(--green);color:#fff;font-weight:800;font-size:1.08rem;
    padding:19px 22px;border-radius:16px;border:none;cursor:pointer;
    box-shadow:0 10px 26px rgba(26,138,79,.38);
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
    margin:22px 0 10px;animation:ctaPulse 2.4s ease-in-out infinite;
  }
  .cta::after{content:"→";font-size:1.15em;line-height:1}
  .cta:hover{background:var(--green-strong);transform:translateY(-2px);box-shadow:0 16px 34px rgba(26,138,79,.5)}
  .cta:active{transform:translateY(0)}
  @keyframes ctaPulse{
    0%,100%{box-shadow:0 10px 26px rgba(26,138,79,.38)}
    50%{box-shadow:0 12px 32px rgba(26,138,79,.6)}
  }
  @media(prefers-reduced-motion:reduce){ .cta{animation:none} }

  .hint{font-size:.88rem;color:var(--muted)}

  .info{
    margin-top:22px;display:inline-flex;align-items:center;gap:8px;
    font-size:.9rem;font-weight:600;color:var(--ink);
    background:var(--bg-soft);border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;
  }

  footer{padding:18px;text-align:center}
  footer p{font-size:.75rem;color:var(--muted)}

  @media(min-width:640px){
    h1{font-size:1.8rem}
    .cta{max-width:340px;margin-left:auto;margin-right:auto}
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="card">

    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a8a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>

    <h1>Рўйхатдан ўтдингиз!</h1>
    <p class="lead">Вебинар ҳаволаси ва эслатма — <b>Telegram каналимизда</b> юборилади.
      Ҳозир каналга қўшилиб қўйинг, акс ҳолда эфирни ўтказиб юборишингиз мумкин.</p>

    <a class="cta" id="tgBtn" href="#" rel="noopener">Telegram каналига қўшилиш</a>
    <p class="hint">Каналга ўтгач, «Қўшилиш» (Join) тугмасини босишни унутманг.</p>

    <div class="info">🗓 Вебинар: 8–9 сентябр, 20:00</div>

  </div>
</main>

<footer>
  <p>© <span id="yr"></span> Собир Саид</p>
</footer>

<script>
  (function(){
    document.getElementById('yr').textContent = new Date().getFullYear();

    // OXIRGI CHORA fallback — faqat `tg` yetib kelmasa
    var FALLBACK = 'https://t.me/+R26YNxaF0dVmYjUy';
    // Funnel beacon proxy (o'z domenimiz, API kalitsiz)
    var TRACK_API = '/api/track-event';
    var q = new URLSearchParams(location.search);

    // 1) telegram_link — forma-muvaffaqiyat javobidan `?tg=` orqali uzatilgan.
    //    Hardcoded EMAS. To'g'ri t.me havolasi bo'lmasa — fallback.
    var tg = q.get('tg');
    try { tg = tg ? decodeURIComponent(tg) : null; } catch(_) { tg = null; }
    if (!tg || !/^https:\/\/t\.me\//i.test(tg)) tg = FALLBACK;

    // 2) campaign_id / ad_id — yo'qolmasin. Query'dan yoki sessionStorage'dan
    //    o'qiladi va qayta yoziladi (keyingi sahifalar ham ko'radi).
    function keep(name, qkey){
      var v = q.get(qkey) || null;
      try {
        if (v) sessionStorage.setItem('lead_' + name, v);
        else v = sessionStorage.getItem('lead_' + name);
      } catch(_){}
      return v || null;
    }
    var CAMPAIGN_ID = keep('campaign_id', 'c');
    var AD_ID       = keep('ad_id', 'a');
    var FBCLID      = keep('fbclid', 'f');

    // Funnel beacon — o'z proxy'imizga. keepalive: navigatsiya paytida ham yakunlanadi.
    function track(eventType){
      try {
        fetch(TRACK_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event_type: eventType, campaign_id: CAMPAIGN_ID, ad_id: AD_ID }),
          keepalive: true
        });
      } catch(_){}
    }

    var btn = document.getElementById('tgBtn');
    btn.href = tg;

    // "Rahmat sahifasiga o'tdi" — sahifa yuklangan zahoti
    track('thank_you_view');

    // "TG tugmasini bosdi" — navigatsiyani to'xtatmaymiz, faqat fon so'rovi
    btn.addEventListener('click', function(){ track('tg_click'); });
  })();
</script>

</body>
</html>
